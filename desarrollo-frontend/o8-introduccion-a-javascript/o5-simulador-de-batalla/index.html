<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador de Batalla ⚔️🐲</title>
</head>

<body>
  <h1>Simulador de Batalla ⚔️🐲</h1>

  <script>
    alert("⚔️ ¡Bienvenido al Simulador de Batalla Épica! 🐲");

    const warriorName = prompt('¿Cuál es el nombre del guerrero? 👨‍🚀');
    let warriorHealth = parseInt(prompt(`¿Cuánta vida tiene ${warriorName}? ❤️`));
    let warriorAttack = parseInt(prompt(`¿Cuánto poder de ataque tiene ${warriorName}? ⚔️`));
    const dragonName = prompt('¿Cuál es el nombre del dragón? 🐉');
    let dragonHealth = parseInt(prompt(`¿Cuánta vida tiene ${dragonName}? 💚`));
    let dragonAttack = parseInt(prompt(`¿Cuánto poder de ataque tiene ${dragonName}? ⚔️`));
    let turn = 1;

    if (warriorName && warriorHealth && warriorAttack && dragonName && dragonHealth && dragonAttack) {
      if (warriorHealth > 0 && dragonHealth > 0 && warriorAttack > 0 && dragonAttack > 0) {
        alert(`👨‍🚀 ${warriorName} vs 🐉 ${dragonName}`);

        while (warriorHealth > 0 && dragonHealth > 0) {
          alert(`Turno ${turn}:`);

          // Guerrero ataca al dragón
          dragonHealth = dragonHealth - warriorAttack;
          if (dragonHealth <= 0) dragonHealth = 0;
          alert(`👨‍🚀 ${warriorName} ataca al 🐉 ${dragonName} y le resta ${warriorAttack} vida 💚.\n Vida restante: ${dragonHealth} 💚`);

          // Dragón ataca al guerrero
          warriorHealth -= dragonAttack;
          if (warriorHealth <= 0) warriorHealth = 0;
          alert(`🐉 ${dragonName} ataca al 👨‍🚀 ${warriorName} y le resta ${dragonAttack} vida ❤️.\n Vida restante: ${warriorHealth} ❤️`);
          turn++;
        }

        if (warriorHealth > 0) {
          alert(`👨‍🚀 El guerrero ganó el duelo 💥💥💥`);
        } else if (dragonHealth > 0) {
          alert(`🐉 El dragón ganó el duelo 💥💥💥`);
        } else {
          alert(`😕 ¡Ningún gana! 😕`);
        }
      } else {
        alert('⚠️ Los valores de ataque y vida deben ser positivos.');
      }
    } else {
      alert('⚠️ Por favor, ingresa todos los datos correctamente.');
    }
  </script>
</body>

</html>
