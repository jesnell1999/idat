<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test de Personalidad ✨🔮</title>
</head>

<body>
  <h1>Test de Personalidad ✨🔮</h1>

  <script>
    alert('¡Hola! Bienvenido al Test de Personalidad. Responde las siguientes preguntas:');
    const time = prompt('🌞 ¿Prefieres el día o la noche? 🌚').toLowerCase();
    const weather = prompt('🌡️ ¿Te gusta más el frío o el calor? 🌡️').toLowerCase();
    const power = prompt('🕊️ ¿Preferirías volar o teletransportarse? 🚀').toLowerCase();
    let result = '';

    if (time && weather && power) {
      if (time === 'día' && weather === 'frío' && power === 'volar') {
        result = 'Eres un Mago del Hielo ❄️';
      } else if (time === 'noche' && weather === 'calor' && power === 'teletransportarse') {
        result = 'Eres un Mago del Fuego 🔥';
      } else if (time === 'día' && weather === 'calor' && power === 'teletransportarse') {
        result = 'Eres un Mago del Sol ☀️';
      } else {
        result = '🌌 Eres un Mago Misterioso con poderes únicos ✨';
      }
    } else {
      result = 'Por favor, responde todas las preguntas.';
    }

    // alert(typeof message === 'string');
    alert(result);
  </script>
</body>

</html>
