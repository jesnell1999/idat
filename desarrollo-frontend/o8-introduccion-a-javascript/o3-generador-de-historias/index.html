<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de Historias 🪄📝</title>
</head>

<body>
  <h1>Generador de Historias 🪄📝</h1>
  <script>
    const names = ["Fernanda", "Mijael", "Fe", "Doky", "Elliot"]
    // const names = [];
    const actions = ["quemó", "voló", "navegó", "bailó", "cantó"];
    const places = ["la cocina de las ratitas", "los chanchitos", "el planeta 21", "las estrellas", "un dragón de peluche"];
    const objects = ["con alegría una hervidora", "una escoba mágica", "una bufanda rosa", "una laptop inteligente", "un celular sobrenatural"];
    let message = '';

    const generateHistory = () => {
      const randomName = names[Math.floor(Math.random() * names.length)];
      const randomAction = actions[Math.floor(Math.random() * actions.length)];
      const randomPlace = places[Math.floor(Math.random() * places.length)];
      const randomObject = objects[Math.floor(Math.random() * objects.length)];
      return `${randomName} ${randomAction} en ${randomPlace} con ${randomObject}.`;
    };

    if (names.length && actions.length && places.length && objects.length) {
      message = generateHistory();
    } else {
      message = "No hay suficientes datos para crear una historia.";
    }

    // console.log(typeof message === 'string');
    console.log(message);
  </script>
</body>

</html>
