<head>

  <title>🐷 El Chanchito de la Verdad 💫</title>

<body>
  <h1>🐷 El Chanchito de la Verdad 💫</h1>
  <h5>🎯 ¿Dice la verdad o miente? ¡El chanchito lo sabe! 🔍</h5>

  <script>
    const input = prompt('Dile algo al chanchito:');

  </script>
