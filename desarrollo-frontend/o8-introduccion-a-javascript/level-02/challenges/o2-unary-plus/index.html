<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚡ Operador Unario +</title>
</head>

<body>
  <h1>⚡ Operador Unario +</h1>
  <h5>Abrir la consola para ver los resultados 📝</h5>

  <script>
    const year = '2024';
    const pi = '3.14159';
    const width = '150px';
    const height = '200.5px';
    // Convert year using unary +
    console.log('year:', +year);
    // Convert pi using unary +
    console.log('pi:', +pi);
    // Extract number from width using parseInt
    console.log('width:', parseInt(width));
    // Extract number from height using parseFloat
    console.log('height:', parseFloat(height));
  </script>
</body>

</html>
