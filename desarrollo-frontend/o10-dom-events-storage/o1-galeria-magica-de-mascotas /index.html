<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🖼️ Galería Mágica de Mascotas</title>
  <style>
    .body {
      min-height: 100dvh;
      margin: 0;
      background-image: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fefefe;
      font-family: sans-serif;
    }

    .container {
      max-width: 1280px;
      margin-inline: auto;
      padding-inline: 1rem;
    }

    .pet-gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr));
      gap: 1rem;
      margin-block: 2rem;
    }

    .pet-card {
      padding: 1rem;
      border: 0.125rem solid rgba(255, 255, 255, 0.2);
      border-radius: 1rem;
      background-color: rgba(255, 255, 255, 0.1);
      transition: transform 0.25s;

      &:hover {
        transform: translateY(-0.375rem) scale(1.025);
      }
    }

    .pet-emoji {
      font-size: 3em;
      margin-bottom: 0.75rem;
    }

    .btn {
      padding: 0.5em 1em;
      border: none;
      border-radius: 1.5em;
      background-color: #ff6b6b;
      color: #fefefe;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.25s, transform 0.25s;

      &:hover {
        background-color: #ff5252;
        transform: scale(1.05);
      }
    }

    .btn-add {
      background-color: #4ecdc4;

      &:hover {
        background-color: #389b94;
        transform: scale(1.05);
      }
    }

    .section {
      padding-block: 2rem;
    }
  </style>
</head>

<body class="body">
  <section class="section">
    <div class="container">
      <h1 class="title">🖼️✨ Galería Mágica de Mascotas 🐾🎨</h1>
      <p>¡Descubre a todas las mascotas épicas de nuestro grupo! 🌟</p>
      <button class="btn btn-add" onclick="addNewPet()">➕ Agregar Nueva Mascota</button>
      <div id="pet-gallery" class="pet-gallery">
      </div>
      <p>🎯 Haz click en "Ver Detalles" para conocer más sobre cada mascota</p>
    </div>
  </section>

  <script>
    "use strict";

    // Test system 🧪⚡
    const testResults = [];
    const recordTest = (testName, condition) => {
      const emoji = condition ? "✅" : "❌";
      testResults.push(`${emoji} ${testName}`);
    };

    // Pets database 🐾📊
    const pets = [
      {
        name: "Doky",
        type: "Perro",
        emoji: "🐕",
        specialty: "Guardián Leal y Protector de Códigos",
        level: 5
      },
      {
        name: "Chocolate",
        type: "Perro",
        emoji: "🍫",
        specialty: "Experto en Debugging Diurno",
        level: 4
      },
      {
        name: "Chanchi",
        type: "Chanchito",
        emoji: "🐷",
        specialty: "Maestro del Código Elegante",
        level: 4
      }
    ];

    // ✨ Create your epic functions here ✨

    const createPetCard = (pet) => {
      const petCard = document.createElement("div");
      petCard.className = "pet-card";
      petCard.innerHTML = `
        <span class="pet-emoji">${pet.emoji}</span>
        <h2>${pet.name}</h2>
        <p>Tipo: ${pet.type}</p>
        <p>Especialidad: ${pet.specialty}</p>
        <p>Nivel: ${pet.level}</p>
        <button class="btn" onclick="showPetDetails('${pet.name}')">Ver Detalles</button>
      `;
      return petCard;
    };

    const showPetDetails = (petName) => {
      // 🖱️ Find pet and show epic alert with full details
      // Handle case when pet doesn't exist
    };

    const addNewPet = () => {
      // ➕ Capture data with prompts, validate, add to array
      // Re-render gallery automatically
      console.log("Adding new pet...");
    };

    const renderGallery = () => {
      const gallery = document.getElementById("pet-gallery");

      gallery.innerHTML = "";

      pets.forEach(pet => {
        const petCard = createPetCard(pet);
        gallery.appendChild(petCard);
      });
    };

    const initializeGallery = () => {
      renderGallery();
    };

    // Automatic tests 🤖🧪
    const testGallerySystem = () => {
      // Test 1: Card rendering works 🎨
      const dokyCard = createPetCard(pets[0]);
      recordTest("3.1.1 card rendering works correctly",
        dokyCard?.className?.includes("pet-card") &&
        dokyCard?.innerHTML?.includes("Doky") &&
        dokyCard?.innerHTML?.includes("🐕"));

      // Test 2: Pet search functionality 🔍  
      const originalAlert = window.alert;
      let alertCalled = false;
      window.alert = () => { alertCalled = true; };
      showPetDetails("Doky");
      recordTest("3.1.2 pet details functionality works", alertCalled);
      window.alert = originalAlert;

      // Test 3: Array manipulation 📊
      const initialLength = pets.length;
      // Simulate valid pet addition
      recordTest("3.1.3 pet addition validation works",
        pets.length >= initialLength && Array.isArray(pets));

      // Test 4: DOM query selectors 🎯
      const gallery = document.querySelector("#pet-gallery");
      recordTest("3.1.4 DOM selection works correctly",
        gallery !== null && typeof renderGallery === "function");
    };

    // Initialize on page load 🚀
    document.addEventListener('DOMContentLoaded', () => {
      initializeGallery();

      // Run tests
      testGallerySystem();
      console.log('=== 🧪 Resultados Tests Galería ===');
      testResults.forEach(result => console.log(result));
    });
  </script>
</body>

</html>
