    body {
      font-family: 'Comic Sans MS', cursive;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 20px;
      color: white;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      text-align: center;
    }

    .pet-gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin: 20px 0;
    }

    .pet-card {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 15px;
      padding: 20px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      transition: transform 0.3s ease;
    }

    .pet-card:hover {
      transform: translateY(-5px) scale(1.02);
    }

    .pet-emoji {
      font-size: 3em;
      margin-bottom: 10px;
    }

    .btn {
      background: #ff6b6b;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 25px;
      cursor: pointer;
      font-size: 16px;
      margin: 5px;
      transition: all 0.3s ease;
    }

    .btn:hover {
      background: #ff5252;
      transform: scale(1.05);
    }

    .add-btn {
      background: #4ecdc4;
      font-size: 18px;
      margin: 20px 0;
    }
  </style>
</head>
