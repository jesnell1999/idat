<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Idat I Aprende sobre desarrollo web gratis con los mejores</title>
  <link rel="stylesheet" href="./css/index.css">
</head>

<body>
  <header>
    <nav>
      <a href="#">
        <img src="./assets/img/logo.svg" alt="Logo de Idat" width="24" height="40">
      </a>
      <ul>
        <li>
          <a href="#">Escuela</a>
        </li>
        <li>
          <a href="#">Proyectos</a>
        </li>
      </ul>
      <a href="#contact">Inscríbete</a>
    </nav>
  </header>
  <main>
    <article>
      <div>
        <h1>Aprende desarrollo web en Idat</h1>
        <p>El mejor centro educativo del Perú, aprende todo en un solo lugar gratis e impulsa tu futuro.</p>
        <a href="#">Empezar a aprender</a>
      </div>
    </article>
    <section>
      <div>
        <div>
          <a href="#">
            <h2>Desarrollo Frontend</h2>
            <img src="https://i.postimg.cc/x9MyhM3D/react-system.webp" alt="Desarrollo Frontend" width="256"
              height="144">
          </a>
        </div>
      </div>
    </section>
    <section id="contact">
      <div>
        <h2>Inscríbete</h2>
        <form>
          <label for="name">Nombre</label>
          <input type="text" name="name" id="name" placeholder="Ingresa tu nombre" required>
          <label for="lastName">Apellido</label>
          <input type="text" name="last-name" id="lastName" placeholder="Ingresa tu apellido" required>
          <label for="phone">Celular</label>
          <input type="tel" name="phone" id="phone" placeholder="Ingresa tu celular" maxlength="9" pattern="[0-9]{9}"
            required>
          <label for="email">Email</label>
          <input type="email" name="email" id="email" placeholder="Ingresa tu email" required>
          <label for="DNI">DNI</label>
          <input type="number" name="DNI" id="DNI" placeholder="Ingresa tu DNI" min="00000000" max="99999999">
          <input type="submit" value="Enviar">
        </form>
      </div>
    </section>
  </main>
</body>

</html>
